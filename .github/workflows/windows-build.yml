name: NetworkToolkit Windows x64 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 x64
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installer and self-contained app image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gradle packageReleaseExe createDistributable --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Gradle failed: $LASTEXITCODE" }

          $out = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Locate the bundled JVM first. Do not assume the launcher and runtime
          # are discovered by the same recursive-file filter: jpackage layouts
          # can differ between Compose plugin versions.
          $appBase = Join-Path $PWD 'build/compose/binaries/main/app'
          if (-not (Test-Path $appBase)) { throw "App-image directory missing: $appBase" }

          $javaCandidates = @(Get-ChildItem -Path $appBase -Filter 'java.exe' -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]runtime[\\/]bin[\\/]java\.exe$' })
          if ($javaCandidates.Count -eq 0) {
            Write-Host 'Files produced under app-image directory:'
            Get-ChildItem -Path $appBase -Recurse -File | Select-Object -ExpandProperty FullName | Write-Host
            throw 'Bundled runtime/bin/java.exe was not generated. Check Compose Desktop createDistributable output.'
          }

          $appImage = $null
          $javaExe = $null
          $launcher = $null
          foreach ($candidate in $javaCandidates) {
            # Standard jpackage app-image: <app-image>/runtime/bin/java.exe
            $candidateRuntime = $candidate.Directory.Parent
            $candidateImage = $candidateRuntime.Parent
            $candidateLauncher = Join-Path $candidateImage.FullName 'NetworkToolkit.exe'
            if (Test-Path $candidateLauncher) {
              $appImage = $candidateImage.FullName
              $javaExe = $candidate.FullName
              $launcher = $candidateLauncher
              break
            }
          }

          if (-not $appImage) {
            Write-Host 'Found bundled Java candidates:'
            $javaCandidates | Select-Object -ExpandProperty FullName | Write-Host
            Write-Host 'Found application launchers:'
            Get-ChildItem -Path $appBase -Filter 'NetworkToolkit.exe' -File -Recurse |
              Select-Object -ExpandProperty FullName | Write-Host
            throw 'Could not pair the bundled Java runtime with NetworkToolkit.exe in one jpackage app-image directory.'
          }

          # Verify the JVM that will ship with the portable package.
          & $javaExe -version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Java runtime failed its startup check.' }

          $portableZip = Join-Path $out 'NetworkToolkit-Windows-x64-Portable.zip'
          Compress-Archive -Path (Join-Path $appImage '*') -DestinationPath $portableZip -CompressionLevel Optimal -Force

          # Installer generated by jpackage/Compose Desktop.
          $installerDir = Join-Path $PWD 'build/compose/binaries/main-release/exe'
          $installer = Get-ChildItem -Path $installerDir -Filter '*.exe' -File |
            Where-Object { $_.Name -notlike '*uninstall*' } |
            Select-Object -First 1
          if (-not $installer) { throw "Installer EXE not found in $installerDir" }
          Copy-Item $installer.FullName (Join-Path $out 'NetworkToolkit-Setup.exe') -Force

          Write-Host "Verified app image: $appImage"
          Write-Host "Verified JVM: $javaExe"
          Write-Host "Installer: $out/NetworkToolkit-Setup.exe"
          Write-Host "Portable: $portableZip"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkToolkit-Windows-Setup
          path: artifacts/NetworkToolkit-Setup.exe
          if-no-files-found: error

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkToolkit-Windows-Portable
          path: artifacts/NetworkToolkit-Windows-x64-Portable.zip
          if-no-files-found: error
