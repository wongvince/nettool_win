
name: NetworkToolkit Windows EXE Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build EXE Installer
        run: gradle packageReleaseExe

      - name: Upload EXE Installer
        uses: actions/upload-artifact@v4
        with:
          name: NetworkToolkit-Windows-Installer
          path: build/compose/binaries/main-release/exe/*.exe
          if-no-files-found: error

      - name: Publish EXE on GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/compose/binaries/main-release/exe/*.exe
