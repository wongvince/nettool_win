name: NetworkToolkit Windows x64 Build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main"]
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build Windows installer and app image
        shell: pwsh
        run: gradle packageReleaseExe packageReleaseMsi createDistributable
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetworkToolkit-Windows-x64
          path: |
            build/compose/binaries/main-release/exe/*.exe
            build/compose/binaries/main-release/msi/*.msi
            build/compose/binaries/main/app/NetworkToolkit/**
          if-no-files-found: warn
      - name: Publish release assets on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/compose/binaries/main-release/exe/*.exe
            build/compose/binaries/main-release/msi/*.msi
