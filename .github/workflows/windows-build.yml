name: NetworkToolkit Windows x64 Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 x64
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release installer and release app image
        shell: pwsh
        run: ./build-windows.ps1

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkToolkit-Windows-Setup
          path: artifacts/NetworkToolkit-Setup.exe
          if-no-files-found: error

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkToolkit-Windows-Portable
          path: artifacts/NetworkToolkit-Windows-x64-Portable.zip
          if-no-files-found: error
